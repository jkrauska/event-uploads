<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin &mdash; Event Uploads</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 { font-size: 1.5rem; margin-bottom: 1rem; }

    .auth-form {
      background: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.75rem;
      align-items: end;
    }

    .auth-form label {
      font-weight: 600;
      font-size: 0.85rem;
      display: block;
      margin-bottom: 0.25rem;
    }

    .auth-form input {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      width: 280px;
    }

    .auth-form button {
      padding: 0.5rem 1.25rem;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }

    .auth-form button:hover { background: #3a7bc8; }

    #error {
      color: #d9534f;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .summary {
      background: #fff;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      color: #666;
    }

    .upload-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }

    .upload-card h3 {
      font-size: 1.05rem;
      margin-bottom: 0.15rem;
    }

    .upload-card .meta {
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 0.5rem;
    }

    .upload-card .msg {
      font-style: italic;
      color: #555;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .thumb-item {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
      background: #f9f9f9;
      cursor: pointer;
      flex-shrink: 0;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-item .video-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .thumb-item .thumb-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: 0.7rem;
      color: #999;
      text-align: center;
      padding: 0.25rem;
    }

    .thumb-filename {
      font-size: 0.7rem;
      color: #666;
      margin-top: 2px;
      text-align: center;
      width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Full-size overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      flex-direction: column;
      gap: 1rem;
    }

    .overlay img, .overlay video {
      border-radius: 8px;
    }

    .overlay .overlay-controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .overlay .overlay-filename {
      color: #ccc;
      font-size: 0.9rem;
    }

    .overlay .download-btn,
    .overlay .close-btn,
    .overlay .delete-btn {
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }

    .overlay .download-btn {
      background: #4a90d9;
      color: #fff;
    }

    .overlay .close-btn {
      background: #666;
      color: #fff;
    }

    .overlay .delete-btn {
      background: #d9534f;
      color: #fff;
    }

    .overlay .download-btn:hover { background: #3a7bc8; }
    .overlay .close-btn:hover { background: #555; }
    .overlay .delete-btn:hover { background: #c9302c; }

    /* Overlay nav arrows */
    .overlay .nav-arrows {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.5rem;
    }

    .overlay .nav-arrow {
      pointer-events: auto;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .overlay .nav-arrow:hover:not(:disabled) {
      background: rgba(255,255,255,0.35);
    }

    .overlay .nav-arrow:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .overlay .overlay-media-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .overlay .overlay-media-wrap img,
    .overlay .overlay-media-wrap video {
      max-width: 90vw;
      max-height: 75vh;
      border-radius: 8px;
    }

    .overlay .slideshow-btn {
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      background: #2d7d4a;
      color: #fff;
    }

    .overlay .slideshow-btn:hover { background: #247040; }
    .overlay .slideshow-btn.active { background: #c9302c; }
    .overlay .slideshow-btn.active:hover { background: #a52824; }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
      margin-bottom: 1rem;
    }

    .pagination button {
      padding: 0.4rem 1rem;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }

    .pagination button:hover { background: #3a7bc8; }
    .pagination button:disabled { background: #ccc; cursor: default; }

    .pagination .page-info {
      font-size: 0.9rem;
      color: #666;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 3rem;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Event Uploads &mdash; Admin</h1>

    <div class="auth-form" id="authForm">
      <div>
        <label for="token">Admin Token</label>
        <input type="password" id="token" placeholder="Enter admin or viewer token" />
      </div>
      <button id="loadBtn">Load</button>
    </div>

    <div id="error"></div>
    <div id="content"></div>
  </div>

<script>
  const API_BASE = "/api";
  const PAGE_SIZE = 50;

  const tokenInput = document.getElementById("token");
  const loadBtn    = document.getElementById("loadBtn");
  const errorEl    = document.getElementById("error");
  const contentEl  = document.getElementById("content");

  let allUploads = [];
  let currentPage = 0;
  let adminToken = "";
  let adminRole = ""; // "admin" | "viewer"
  /** Flat list of media files for the current page (for overlay prev/next) */
  let currentPageMediaList = [];

  // Cache for blob URLs so we don't re-fetch thumbnails
  const blobCache = {};

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleString();
  }

  function isImage(type) {
    return type && type.startsWith("image/");
  }

  function isVideo(type) {
    return type && type.startsWith("video/");
  }

  loadBtn.onclick = async () => {
    const token = tokenInput.value.trim();
    if (!token) { errorEl.textContent = "Enter a token"; return; }

    errorEl.textContent = "";
    contentEl.innerHTML = "";
    for (const k of Object.keys(blobCache)) {
      URL.revokeObjectURL(blobCache[k]);
      delete blobCache[k];
    }
    loadBtn.textContent = "Loading\u2026";
    loadBtn.disabled = true;

    try {
      const resp = await fetch(`${API_BASE}/admin/list`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        errorEl.textContent = data.error || "Failed to load";
        loadBtn.textContent = "Load";
        loadBtn.disabled = false;
        return;
      }

      const { uploads, count, role } = await resp.json();

      adminToken = token;
      adminRole = role || "admin";
      allUploads = uploads;
      currentPage = 0;

      renderPage();

      loadBtn.textContent = "Refresh";
      loadBtn.disabled = false;

    } catch (e) {
      errorEl.textContent = "Network error";
      loadBtn.textContent = "Load";
      loadBtn.disabled = false;
    }
  };

  function renderPage() {
    contentEl.innerHTML = "";

    const totalFiles = allUploads.reduce((sum, u) => sum + u.files.length, 0);
    const totalSize  = allUploads.reduce(
      (sum, u) => sum + u.files.reduce((s, f) => s + f.size, 0), 0
    );

    const summary = document.createElement("div");
    summary.className = "summary";
    summary.textContent = `${allUploads.length} upload(s), ${totalFiles} file(s), ${formatBytes(totalSize)} total`;
    if (adminRole === "viewer") {
      summary.textContent += " (view-only; delete disabled)";
    }
    contentEl.appendChild(summary);

    if (allUploads.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No uploads yet.";
      contentEl.appendChild(empty);
      return;
    }

    const totalPages = Math.ceil(allUploads.length / PAGE_SIZE);
    const start = currentPage * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, allUploads.length);
    const pageUploads = allUploads.slice(start, end);
    currentPageMediaList = pageUploads.flatMap(u => u.files);

    for (const upload of pageUploads) {
      const card = document.createElement("div");
      card.className = "upload-card";

      const h3 = document.createElement("h3");
      h3.textContent = upload.name;
      card.appendChild(h3);

      const meta = document.createElement("div");
      meta.className = "meta";
      let metaText = `${formatDate(upload.timestamp)} \u2022 ${upload.files.length} file(s)`;
      if (upload.clientIP) metaText += ` \u2022 IP: ${upload.clientIP}`;
      meta.textContent = metaText;
      card.appendChild(meta);

      if (upload.message) {
        const msg = document.createElement("div");
        msg.className = "msg";
        msg.textContent = `\u201C${upload.message}\u201D`;
        card.appendChild(msg);
      }

      const thumbs = document.createElement("div");
      thumbs.className = "thumbnails";

      for (const file of upload.files) {
        const wrapper = document.createElement("div");
        wrapper.style.display = "inline-block";

        const thumbBox = document.createElement("div");
        thumbBox.className = "thumb-item";
        thumbBox.title = `${file.filename} (${formatBytes(file.size)})`;
        thumbBox.onclick = () => {
          const idx = currentPageMediaList.findIndex(f => f.key === file.key);
          openOverlay(file, currentPageMediaList, idx);
        };

        if (isImage(file.type)) {
          loadThumbnail(file, thumbBox);
        } else if (isVideo(file.type)) {
          const placeholder = document.createElement("div");
          placeholder.className = "thumb-placeholder";
          placeholder.textContent = "\u25B6 Video";
          thumbBox.appendChild(placeholder);

          const badge = document.createElement("div");
          badge.className = "video-badge";
          badge.textContent = "\u25B6";
          thumbBox.appendChild(badge);

          // Try to load video poster frame
          loadVideoThumb(file, thumbBox);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "thumb-placeholder";
          placeholder.textContent = file.filename.split(".").pop().toUpperCase();
          thumbBox.appendChild(placeholder);
        }

        wrapper.appendChild(thumbBox);

        const nameLabel = document.createElement("div");
        nameLabel.className = "thumb-filename";
        nameLabel.textContent = file.filename;
        wrapper.appendChild(nameLabel);

        thumbs.appendChild(wrapper);
      }

      card.appendChild(thumbs);
      contentEl.appendChild(card);
    }

    // Pagination controls
    if (totalPages > 1) {
      const pag = document.createElement("div");
      pag.className = "pagination";

      const prevBtn = document.createElement("button");
      prevBtn.textContent = "\u2190 Previous";
      prevBtn.disabled = currentPage === 0;
      prevBtn.onclick = () => { currentPage--; renderPage(); window.scrollTo(0, 0); };

      const pageInfo = document.createElement("span");
      pageInfo.className = "page-info";
      pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages}`;

      const nextBtn = document.createElement("button");
      nextBtn.textContent = "Next \u2192";
      nextBtn.disabled = currentPage >= totalPages - 1;
      nextBtn.onclick = () => { currentPage++; renderPage(); window.scrollTo(0, 0); };

      pag.appendChild(prevBtn);
      pag.appendChild(pageInfo);
      pag.appendChild(nextBtn);
      contentEl.appendChild(pag);
    }
  }

  async function fetchFileBlob(file) {
    if (blobCache[file.key]) return blobCache[file.key];

    const resp = await fetch(`${API_BASE}/admin/file/${encodeURIComponent(file.key)}`, {
      headers: { "Authorization": `Bearer ${adminToken}` }
    });

    if (!resp.ok) return null;

    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    blobCache[file.key] = url;
    return url;
  }

  async function loadThumbnail(file, container) {
    const placeholder = document.createElement("div");
    placeholder.className = "thumb-placeholder";
    placeholder.textContent = "\u2026";
    container.appendChild(placeholder);

    const url = await fetchFileBlob(file);
    if (url) {
      container.innerHTML = "";
      const img = document.createElement("img");
      img.src = url;
      img.alt = file.filename;
      img.loading = "lazy";
      container.appendChild(img);
    } else {
      placeholder.textContent = "Error";
    }
  }

  async function loadVideoThumb(file, container) {
    const url = await fetchFileBlob(file);
    if (!url) return;

    // Create an off-screen video to grab a poster frame
    const video = document.createElement("video");
    video.src = url;
    video.muted = true;
    video.preload = "metadata";

    video.onloadeddata = () => {
      video.currentTime = 0.5; // grab frame at 0.5s
    };

    video.onseeked = () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 200;
        canvas.height = 200;
        const ctx = canvas.getContext("2d");

        // Center-crop
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const side = Math.min(vw, vh);
        const sx = (vw - side) / 2;
        const sy = (vh - side) / 2;

        ctx.drawImage(video, sx, sy, side, side, 0, 0, 200, 200);

        const thumbUrl = canvas.toDataURL("image/jpeg", 0.7);

        container.innerHTML = "";
        const img = document.createElement("img");
        img.src = thumbUrl;
        img.alt = file.filename;
        container.appendChild(img);

        const badge = document.createElement("div");
        badge.className = "video-badge";
        badge.textContent = "\u25B6";
        container.appendChild(badge);
      } catch (e) {
        // CORS or other error — keep placeholder
      }
    };
  }

  const SLIDESHOW_INTERVAL_MS = 4000;

  function openOverlay(initialFile, mediaList, initialIndex) {
    const list = mediaList && mediaList.length ? mediaList : [initialFile];
    const index = initialIndex >= 0 && initialIndex < list.length ? initialIndex : 0;

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay._mediaList = list;
    overlay._currentIndex = index;
    overlay._currentFile = null;
    overlay._currentUrl = null;
    overlay._slideshowTimer = null;

    const closeOverlay = () => {
      if (overlay._slideshowTimer) clearInterval(overlay._slideshowTimer);
      overlay.remove();
      document.removeEventListener("keydown", onKey);
    };

    const onKey = (e) => {
      if (e.key === "Escape") closeOverlay();
      else if (e.key === "ArrowLeft") goPrev();
      else if (e.key === "ArrowRight") goNext();
    };

    overlay.onclick = (e) => {
      if (e.target === overlay) closeOverlay();
    };

    const mediaWrap = document.createElement("div");
    mediaWrap.className = "overlay-media-wrap";

    const navArrows = document.createElement("div");
    navArrows.className = "nav-arrows";

    const prevBtn = document.createElement("button");
    prevBtn.className = "nav-arrow";
    prevBtn.type = "button";
    prevBtn.innerHTML = "&#10094;";
    prevBtn.title = "Previous";
    prevBtn.addEventListener("click", (e) => { e.stopPropagation(); goPrev(); });

    const nextBtn = document.createElement("button");
    nextBtn.className = "nav-arrow";
    nextBtn.type = "button";
    nextBtn.innerHTML = "&#10095;";
    nextBtn.title = "Next";
    nextBtn.addEventListener("click", (e) => { e.stopPropagation(); goNext(); });

    navArrows.appendChild(prevBtn);
    navArrows.appendChild(nextBtn);
    mediaWrap.appendChild(navArrows);

    const loading = document.createElement("div");
    loading.className = "overlay-loading";
    loading.style.color = "#ccc";
    loading.textContent = "Loading\u2026";
    mediaWrap.appendChild(loading);

    overlay.appendChild(mediaWrap);

    const controls = document.createElement("div");
    controls.className = "overlay-controls";

    const fname = document.createElement("span");
    fname.className = "overlay-filename";
    controls.appendChild(fname);

    const dlBtn = document.createElement("button");
    dlBtn.className = "download-btn";
    dlBtn.textContent = "Download";
    dlBtn.onclick = (e) => {
      e.stopPropagation();
      const url = overlay._currentUrl;
      const file = overlay._currentFile;
      if (!url || !file) return;
      const a = document.createElement("a");
      a.href = url;
      a.download = file.filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    };
    controls.appendChild(dlBtn);

    const slideshowBtn = document.createElement("button");
    slideshowBtn.className = "slideshow-btn";
    slideshowBtn.textContent = "Slideshow";
    slideshowBtn.title = "Start / stop slideshow";
    slideshowBtn.onclick = (e) => {
      e.stopPropagation();
      if (overlay._slideshowTimer) {
        clearInterval(overlay._slideshowTimer);
        overlay._slideshowTimer = null;
        slideshowBtn.textContent = "Slideshow";
        slideshowBtn.classList.remove("active");
      } else {
        slideshowBtn.textContent = "Stop slideshow";
        slideshowBtn.classList.add("active");
        const advance = () => {
          if (overlay._currentIndex < overlay._mediaList.length - 1) goNext();
          else {
            clearInterval(overlay._slideshowTimer);
            overlay._slideshowTimer = null;
            slideshowBtn.textContent = "Slideshow";
            slideshowBtn.classList.remove("active");
          }
        };
        overlay._slideshowTimer = setInterval(advance, SLIDESHOW_INTERVAL_MS);
      }
    };
    controls.appendChild(slideshowBtn);

    if (adminRole === "admin") {
      const delBtn = document.createElement("button");
      delBtn.className = "delete-btn";
      delBtn.textContent = "Delete";
      delBtn.onclick = (e) => {
        e.stopPropagation();
        const file = overlay._currentFile;
        if (!file || !confirm(`Delete "${file.filename}"? This cannot be undone.`)) return;
        fetch(`${API_BASE}/admin/file/${encodeURIComponent(file.key)}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${adminToken}` }
        }).then(async resp => {
          if (!resp.ok) {
            const data = await resp.json().catch(() => ({}));
            alert(data.error || "Delete failed");
            return;
          }
          const upload = allUploads.find(u => u.files.some(f => f.key === file.key));
          if (upload) {
            const idx = upload.files.findIndex(f => f.key === file.key);
            if (idx !== -1) upload.files.splice(idx, 1);
            if (upload.files.length === 0) {
              allUploads.splice(allUploads.indexOf(upload), 1);
            }
          }
          if (blobCache[file.key]) {
            URL.revokeObjectURL(blobCache[file.key]);
            delete blobCache[file.key];
          }
          closeOverlay();
          renderPage();
        }).catch(() => alert("Network error"));
      };
      controls.appendChild(delBtn);
    }

    const closeBtn = document.createElement("button");
    closeBtn.className = "close-btn";
    closeBtn.textContent = "Close";
    closeBtn.onclick = (e) => {
      e.stopPropagation();
      closeOverlay();
    };
    controls.appendChild(closeBtn);

    overlay.appendChild(controls);
    document.body.appendChild(overlay);
    document.addEventListener("keydown", onKey);

    function goPrev() {
      if (overlay._currentIndex <= 0) return;
      showMediaAt(overlay._currentIndex - 1);
    }

    function goNext() {
      if (overlay._currentIndex >= overlay._mediaList.length - 1) return;
      showMediaAt(overlay._currentIndex + 1);
    }

    function showMediaAt(i) {
      overlay._currentIndex = i;
      const file = overlay._mediaList[i];
      prevBtn.disabled = i <= 0;
      nextBtn.disabled = i >= overlay._mediaList.length - 1;

      // Remove current media node (keep nav arrows)
      const wrap = overlay.querySelector(".overlay-media-wrap");
      const oldMedia = wrap.querySelector("img, video, .overlay-no-preview");
      if (oldMedia) oldMedia.remove();
      const oldLoading = wrap.querySelector(".overlay-loading");
      if (oldLoading) oldLoading.remove();

      const loadingEl = document.createElement("div");
      loadingEl.className = "overlay-loading";
      loadingEl.style.color = "#ccc";
      loadingEl.textContent = "Loading\u2026";
      wrap.appendChild(loadingEl);

      fetchFileBlob(file).then(url => {
        if (loadingEl.parentNode) loadingEl.remove();
        if (!url) {
          const msg = document.createElement("div");
          msg.className = "overlay-no-preview";
          msg.style.color = "#ccc";
          msg.textContent = "Failed to load";
          wrap.appendChild(msg);
          overlay._currentFile = file;
          overlay._currentUrl = null;
        } else {
          overlay._currentFile = file;
          overlay._currentUrl = url;
          if (isImage(file.type)) {
            const img = document.createElement("img");
            img.src = url;
            img.alt = file.filename;
            wrap.appendChild(img);
          } else if (isVideo(file.type)) {
            const video = document.createElement("video");
            video.src = url;
            video.controls = true;
            video.autoplay = true;
            wrap.appendChild(video);
          } else {
            const msg = document.createElement("div");
            msg.className = "overlay-no-preview";
            msg.style.color = "#ccc";
            msg.textContent = "No preview available";
            wrap.appendChild(msg);
          }
        }
        fname.textContent = `${file.filename} (${formatBytes(file.size)})`;
      });
    }

    // Swipe handling
    let touchStartX = 0;
    mediaWrap.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });
    mediaWrap.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const dx = touchStartX - touchEndX;
      const minSwipe = 50;
      if (dx > minSwipe) goNext();
      else if (dx < -minSwipe) goPrev();
    }, { passive: true });

    showMediaAt(index);
  }

  tokenInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loadBtn.click();
  });
</script>
</body>
</html>
